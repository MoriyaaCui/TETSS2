[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tetss2"
version = "0.1.0"
description = "TETSS2.0: a PyTorch model for predicting TE-TSS activity from DNA sequences."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "torch>=1.10"
]

authors = [
    { name = "Moriyaa Cui", email = "2311459@tongji.edu.cn" }
]

[project.scripts]
tetss2 = "tetss2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tetss2 = ["assets/*.pth"]



